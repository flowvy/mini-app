---
name: CI

"on":
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: flowvy
          POSTGRES_USER: flowvy
          POSTGRES_PASSWORD: flowvy_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowvy -d flowvy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: 000000:TEST
      DATABASE_URL: postgresql+asyncpg://flowvy:flowvy_dev@localhost:5432/flowvy
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.6"
          python-version: "3.14.7"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Create disposable test database
        working-directory: .
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U flowvy -d postgres \
            -c "CREATE USER test WITH PASSWORD 'test';"
          docker exec "${{ job.services.postgres.id }}" \
            psql -U flowvy -d postgres \
            -c "CREATE DATABASE test OWNER test;"
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Verify migrations
        run: |
          test "$(uv run --frozen alembic heads | grep -c '(head)')" -eq 1
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
      - name: Test
        run: uv run --frozen pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: UI smoke
        run: pnpm test:e2e:ci
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
