---
name: Release
run-name: Release ${{ github.ref_name }}

"on":
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi

      - name: Validate release metadata
        shell: pwsh
        run: >-
          ./scripts/release.ps1
          -Version $env:GITHUB_REF_NAME
          -OutputDirectory (Join-Path $env:RUNNER_TEMP "flowvy-release-notes")

      - name: Require successful main CI for the tagged commit
        run: |
          tag_commit="$(git rev-parse HEAD)"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --event push \
            --commit "$tag_commit" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No main CI run exists for tagged commit $tag_commit." >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --compact --exit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          notes_file="$RUNNER_TEMP/flowvy-release-notes/release-notes.md"
          release_args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "$GITHUB_REF_NAME"
            --notes-file "$notes_file"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
