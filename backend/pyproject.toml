[project]
name = "flowvy"
version = "0.1.0"
description = "Telegram Mini App + Bot for Xray proxy subscription management"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.26,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "redis>=5.0,<6",
    "dishka>=1.5,<2",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "structlog>=24.0,<25",
    "psutil>=6.0,<7",
    "python-multipart>=0.0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowvy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires disposable PostgreSQL and/or Redis services",
]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["flowvy"]
