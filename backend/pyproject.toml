[project]
name = "flowvy"
version = "0.1.0"
description = "Telegram Mini App + Bot for Xray proxy subscription management"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31,<4",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.19,<2",
    "redis>=8.1,<9",
    "dishka>=1.10,<2",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<1",
    "structlog>=26.1,<27",
    "psutil>=7.2,<8",
    "python-multipart>=0.0.32",
    "boto3>=1.43.80,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    "ruff>=0.16.4,<1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowvy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires disposable PostgreSQL and/or Redis services",
]

[tool.ruff]
target-version = "py314"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["flowvy"]
