name: mini-app

x-app-environment: &app-environment
  VERSION: ${MINI_APP_VERSION:-latest}
  HOST: 0.0.0.0
  PORT: 8001
  STATIC_DIR: /app/frontend
  ALLOWED_HOSTS: ${APP_DOMAIN:?Set APP_DOMAIN in .env},localhost,127.0.0.1
  DEBUG: "false"
  BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
  WEBAPP_URL: https://${APP_DOMAIN}
  WEBHOOK_URL: https://${APP_DOMAIN}/webhook
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET in .env}
  ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:?Set ADMIN_TELEGRAM_IDS in .env}
  DATABASE_URL: postgresql+asyncpg://flowvy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/flowvy
  REDIS_URL: redis://redis:6379/0
  REMNAWAVE_URL: ${REMNAWAVE_URL:?Set REMNAWAVE_URL in .env}
  REMNAWAVE_API_TOKEN: ${REMNAWAVE_API_TOKEN:?Set REMNAWAVE_API_TOKEN in .env}
  REMNAWAVE_WEBHOOK_SECRET: ${REMNAWAVE_WEBHOOK_SECRET:?Set REMNAWAVE_WEBHOOK_SECRET in .env}
  KUMA_ALLOWED_PRIVATE_ORIGINS: ${KUMA_ALLOWED_PRIVATE_ORIGINS:-}
  BESZEL_EMAIL: ${BESZEL_EMAIL:-}
  BESZEL_PASSWORD: ${BESZEL_PASSWORD:-}
  BESZEL_ALLOWED_PRIVATE_ORIGINS: ${BESZEL_ALLOWED_PRIVATE_ORIGINS:-}
  TRIBUTE_API_KEY: ${TRIBUTE_API_KEY:-}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}

x-app-service: &app-service
  image: ${MINI_APP_IMAGE:-ghcr.io/flowvy/mini-app}:${MINI_APP_VERSION:-latest}
  environment: *app-environment
  init: true
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    <<: *app-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/ready', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowvy
      POSTGRES_USER: flowvy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowvy -d flowvy"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:
